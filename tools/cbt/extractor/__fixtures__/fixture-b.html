  <h2>Q1</h2>
  <div class="question-text">다음 중 화물자동차 안전운행에 관한 설명으로 올바른 것은?</div>
  <ol class="options">
    <li>전방 차량과의 안전거리를 충분히 확보한다</li>
    <li>졸음이 오면 계속 주행한다</li>
    <li>과적 상태로 고속 주행한다</li>
    <li>커브길에서 과속한다</li>
  </ol>
  <div class="answer">정답: ①</div>
  <div class="explanation">안전거리 확보는 필수 안전운행 원칙입니다.</div>
