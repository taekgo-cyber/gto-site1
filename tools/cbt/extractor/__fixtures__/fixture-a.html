<div class="question">
  <h3>문제 1</h3>
  <p>화물자동차의 최대적재량을 초과하여 화물을 운송한 경우에 대한 설명으로 올바른 것은?</p>
  <p>① 운전면허가 즉시 취소된다</p>
  <p>② 과태료·벌점 등 행정처분을 받을 수 있다</p>
  <p>③ 아무런 제재가 없다</p>
  <p>④ 사업용 화물차는 예외로 처벌하지 않는다</p>
  <p class="answer">정답: ③</p>
  <p class="explanation">해설: 과적 운행은 도로 파손과 안전사고의 원인이므로 행정처분 대상입니다.</p>
</div>
